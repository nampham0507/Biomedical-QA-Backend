version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biomedical-qa-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./vector_store:/app/vector_store

networks:
  default:
    driver: bridge
